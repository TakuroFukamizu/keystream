<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEYSTREAM TRANSMITTER</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #000;
        }
        body {
            color: #ff5a00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            border: 2px solid #ff5a00;
            padding: 25px;
            background-color: #120500;
            box-shadow: 0 0 20px rgba(255, 90, 0, 0.4);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            border-bottom: 2px solid #ff5a00;
            padding-bottom: 10px;
            margin-top: 0;
            letter-spacing: 2px;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-size: 14px;
        }
        .ip-config {
            margin-bottom: 20px;
            border: 1px dashed #ff5a00;
            padding: 12px;
            background-color: #0d0400;
        }
        .ip-input {
            width: 100%;
            padding: 8px;
            background-color: #000;
            border: 1px solid #ff5a00;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: 180px;
            background-color: #000;
            border: 1px solid #ff5a00;
            color: #fff;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            resize: none;
        }
        textarea:focus {
            outline: none;
            box-shadow: 0 0 5px #ff5a00;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin: 15px 0;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        input[type="radio"] {
            accent-color: #ff5a00;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        .btn-sub {
            background-color: #ff5a00;
            color: #000;
        }
        .btn-sub:hover {
            background-color: #ff7830;
            box-shadow: 0 0 10px rgba(255, 90, 0, 0.5);
        }
        .btn-main {
            background-color: #ff0000;
            color: #fff;
            border: 1px solid #ff5a00;
        }
        .btn-main:hover {
            background-color: #ff3333;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        .status-panel {
            margin-top: 20px;
            border: 1px solid #320a0a;
            background-color: #0a0202;
            padding: 10px;
            font-size: 12px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        .status-val {
            font-weight: bold;
        }
        .online { color: #00ff64; }
        .offline { color: #ff0000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>KEYSTREAM TRANSMITTER</h1>
        
        <div class="ip-config">
            <label for="m5Ip">M5STACK IP ADDRESS:</label>
            <input type="text" id="m5Ip" class="ip-input" placeholder="例: 192.168.10.15">
        </div>

        <form id="txForm">
            <label for="text">TRANSMIT BUFFER DATA:</label>
            <textarea id="text" placeholder="送信する文字列を入力してください..."></textarea>
            
            <label>KEYBOARD LAYOUT:</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="layout" value="jis" checked> JIS (日本語)
                </label>
                <label class="radio-label">
                    <input type="radio" name="layout" value="us"> US (英語)
                </label>
            </div>
            
            <div class="button-group">
                <button type="button" id="btnBuffer" class="btn-sub">BUFFER ONLY</button>
                <button type="button" id="btnDirect" class="btn-main">DIRECT SEND</button>
            </div>
        </form>

        <div class="status-panel">
            <div class="status-item">
                <span>SYSTEM STATUS:</span>
                <span id="sysStatus" class="offline">OFFLINE</span>
            </div>
            <div class="status-item">
                <span>USB KEYBOARD:</span>
                <span id="usbStatus" class="offline">UNKNOWN</span>
            </div>
            <div class="status-item">
                <span>TRANSMITTING:</span>
                <span id="txStatus">IDLE</span>
            </div>
        </div>
    </div>

    <script>
        const btnBuffer = document.getElementById('btnBuffer');
        const btnDirect = document.getElementById('btnDirect');
        const usbStatus = document.getElementById('usbStatus');
        const txStatus = document.getElementById('txStatus');
        const sysStatus = document.getElementById('sysStatus');
        const ipInput = document.getElementById('m5Ip');

        // ローカルストレージからIPアドレスを読み込み
        const savedIp = localStorage.getItem('keystream_ip');
        if (savedIp) {
            ipInput.value = savedIp;
        }

        // IPアドレスを保存
        ipInput.addEventListener('change', () => {
            localStorage.setItem('keystream_ip', ipInput.value.trim());
            updateStatus();
        });

        // 状態監視
        async function updateStatus() {
            const ip = ipInput.value.trim();
            if (!ip) {
                sysStatus.textContent = 'IP UNCONFIGURED';
                sysStatus.className = 'status-val offline';
                return;
            }

            try {
                const res = await fetch(`http://${ip}/api/status`);
                const data = await res.json();
                
                if (data.usb_mounted) {
                    usbStatus.textContent = 'MOUNTED';
                    usbStatus.className = 'status-val online';
                } else {
                    usbStatus.textContent = 'NOT MOUNTED';
                    usbStatus.className = 'status-val offline';
                }

                if (data.usb_sending) {
                    txStatus.textContent = 'TYPING...';
                    txStatus.style.color = '#ffcc00';
                } else {
                    txStatus.textContent = 'IDLE';
                    txStatus.style.color = '#ff5a00';
                }

                sysStatus.textContent = 'CONNECTED';
                sysStatus.className = 'status-val online';
            } catch (e) {
                sysStatus.textContent = 'OFFLINE (CONNECTION FAILED)';
                sysStatus.className = 'status-val offline';
                usbStatus.textContent = 'UNKNOWN';
                usbStatus.className = 'status-val offline';
                txStatus.textContent = 'IDLE';
                txStatus.style.color = '#ff5a00';
            }
        }

        setInterval(updateStatus, 2000);
        updateStatus();

        async function sendData(direct) {
            const ip = ipInput.value.trim();
            const text = document.getElementById('text').value;
            const layout = document.querySelector('input[name="layout"]:checked').value;
            
            if (!ip) {
                alert('M5StackのIPアドレスを設定してください。');
                return;
            }
            if (!text) return;

            try {
                const res = await fetch(`http://${ip}/api/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, layout, direct })
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    if (direct) {
                        alert('データをPCへ即時送信しました。');
                    } else {
                        alert('データをM5Stackの送信バッファに転送しました。\n本体の画面をタップしてPCへ送信してください。');
                    }
                    document.getElementById('text').value = '';
                } else {
                    alert('送信エラーが発生しました。');
                }
            } catch (err) {
                alert('M5Stackへの通信に失敗しました。IPアドレスとWi-Fi接続状態を確認してください。');
            }
        }

        btnBuffer.addEventListener('click', () => sendData(false));
        btnDirect.addEventListener('click', () => sendData(true));
    </script>
</body>
</html>
